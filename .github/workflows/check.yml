name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON manifests parse
        run: for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: Skill name matches its folder
        run: |
          for f in plugins/*/skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$f")")
            grep -q "^name: $dir$" "$f" || { echo "::error file=$f::name must be '$dir'"; exit 1; }
          done
      - name: Skill tree and embedded code are up to date
        run: python3 tools/build.py --check
      - name: Website pages are built and calculators match the Python
        run: |
          python3 tools/build_site.py --check
          python3 tools/check_site.py
      - name: Scripts pass their self-checks
        run: |
          python3 plugins/canada-finance/skills/canada-registered-accounts/scripts/tfsa_room.py --start 2022
          python3 plugins/canada-finance/skills/canada-capital-gains/scripts/acb.py examples/canada-trades.csv
          python3 plugins/india-finance/skills/india-income-tax/scripts/tax_calc.py --income 1500000 --salaried
          python3 plugins/india-finance/skills/india-capital-gains/scripts/cg.py examples/india-tradebook.csv
          python3 plugins/india-finance/skills/india-gst/scripts/gst.py check 27AAPFU0939F1ZV
          python3 plugins/us-finance/skills/us-income-tax/scripts/us_tax.py --wages 85000 --ltcg 4000 --magi 160500
          python3 plugins/creator/skills/creator-brand-deals/scripts/rates.py examples/creator-posts.csv --followers 25000 --cpm-low 15 --cpm-high 30
          python3 plugins/crypto/skills/crypto-portfolio/scripts/crypto.py examples/crypto-ledger.csv ca
